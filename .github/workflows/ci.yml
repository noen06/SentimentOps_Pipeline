name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install light deps (no torch / TF)
        run: pip install -r requirements-ci.txt
      - name: Run unit tests
        env:
          SKIP_MODEL_LOAD: "1"
        run: pytest tests/test_api.py tests/test_preprocess.py

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (smoke)
        run: docker build -t tesa-cf:ci .
